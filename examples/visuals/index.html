<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File streams — runnable visual examples</title>
<style>
:root{color-scheme:light;--ink:#152132;--muted:#526173;--line:#d5dce5;--accent:#2454a6;--paper:#fff;--back:#f4f6f9;--error:#9d2923;--success:#17613c}
*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}header strong{font-size:17px}header span{font-size:11px;letter-spacing:.13em;color:var(--muted)}h1{font-size:27px;line-height:1.25;letter-spacing:-.025em;margin:0 0 10px}h2{font:600 14px/1.4 ui-monospace,monospace;margin:0 0 18px;color:var(--muted)}.intro{margin:0 0 24px;color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--paper)}section{margin:0}label{display:block;font-size:14px;font-weight:600}input{display:block;max-width:100%;width:100%;margin:8px 0 12px;font:13px/1.4 system-ui,sans-serif;color:var(--muted)}input::file-selector-button{border:1px solid var(--line);background:var(--back);color:var(--ink);padding:10px 8px;border-radius:6px;cursor:pointer;margin-right:8px}button{min-height:44px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;font:600 14px system-ui,sans-serif;padding:10px 14px;margin:6px 8px 10px 0;cursor:pointer}button:hover{filter:brightness(.94)}button.secondary,button+button{background:#fff;color:var(--ink);border-color:var(--line)}button:disabled{cursor:default;background:#e6ebf2;border-color:#e6ebf2;color:#697588}button:focus-visible,input:focus-visible{outline:3px solid #82a7ed;outline-offset:3px}progress{display:block;appearance:none;width:100%;height:8px;margin:12px 0;border:0;border-radius:9px;overflow:hidden;background:#e5eaf1}progress::-webkit-progress-bar{background:#e5eaf1}progress::-webkit-progress-value{background:var(--accent);border-radius:9px}[data-transfer-status]{font-size:14px;min-height:30px}[data-transfer-status=complete]{color:var(--success);font-weight:600}[role=alert]{color:var(--error);font-size:14px;background:#fff4f2;padding:12px;border-radius:6px}[role=alert] p{margin:6px 0 0}.note{font-size:13px;line-height:1.5;color:var(--muted);margin:12px 0 0}.receipt{min-height:66px;font-size:14px;color:var(--success);padding-top:6px}.receipt p{margin:8px 0}.code{font:13px ui-monospace,monospace;color:var(--error)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,monospace;background:var(--back);padding:14px;border-radius:6px;min-height:85px}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:22px}@media(max-width:600px){main{padding:20px}.columns{grid-template-columns:1fr}header span{display:none}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="root"></div><script type="module" src="/main.js"></script></html>
